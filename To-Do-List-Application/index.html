<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>To-Do List Application</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container"><div class="card">
<h1>To-Do List</h1><p>Manage your daily tasks</p>
<div class="input"><input id="taskInput" placeholder="Enter a new task..."><button id="addBtn">Add Task</button></div>
<ul id="taskList"></ul>
<div class="footer"><span id="count">0 tasks remaining</span><button id="clear">Clear Completed</button></div>
</div></div>
<script src="script.js"></script>
</body></html>
